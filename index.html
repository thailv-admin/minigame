<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<title>Cờ 2 Người Online</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0f1d;--p1:#111a2f;--p2:#1a2542;--bd:#2b3a5e;--tx:#e8eefc;--mu:#93a1c0;--ac:#38bdf8;--am:#fbbf24;--rd:#fb7185;--gn:#34d399;--appH:100vh}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html{overflow-x:hidden;overflow-y:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;margin:0 auto;width:100%;max-width:560px;height:var(--appH);display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(120% 60% at 50% 0,#13203f 0,var(--bg) 60%)}
@media(min-width:561px){#app{border-left:1px solid #16213b;border-right:1px solid #16213b}}
.screen{display:none;flex:1 1 0;min-height:0;flex-direction:column}
.screen.on{display:flex}
.hidden{display:none!important}

/* ---------- chung ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px;flex:0 0 auto}
.bar .bt{flex:1;min-width:0;text-align:center;line-height:1.15}
.bar .bt div{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt small{display:block;font-size:11px;color:var(--am);font-weight:700;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--p1);font-size:18px;display:grid;place-items:center;padding:0}
.btn{min-height:46px;border-radius:13px;border:1px solid var(--bd);background:var(--p2);font-weight:800;font-size:14px;padding:0 14px}
.btn.pri{background:linear-gradient(135deg,#0ea5e9,#2563eb);border:0;color:#fff;box-shadow:0 6px 18px -6px #2563eb}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);border:0;color:#1c1100}
.btn.red{background:#7f1d1d;border-color:#b91c1c}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}

/* ---------- trang chủ ---------- */
.hhead{padding:14px 16px 6px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#06b6d4,#2563eb);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 20px -8px #06b6d4}
.hhead h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.3px;background:linear-gradient(90deg,#22d3ee,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hhead p{margin:2px 0 0;font-size:11px;color:var(--mu)}
.hgrid{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.card{border-radius:20px;padding:12px;border:1px solid rgba(255,255,255,.1);color:#fff;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:150px;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 14px 28px -16px var(--c1)}
.card:active{transform:scale(.97)}
.card .ic{font-size:42px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.card .ic.t{font-family:"Ma Shan Zheng","Noto Serif TC","Songti SC",serif;font-weight:700}
.card b{font-size:16px;margin-top:2px}
.card small{font-size:11px;opacity:.88;line-height:1.25}
.card .tags{margin-top:auto;font-size:10px;font-weight:700;opacity:.95;padding-top:4px}
.hfoot{flex:0 0 auto;text-align:center;font-size:10px;color:var(--mu);padding:4px 10px 8px}

/* ---------- phòng chờ ---------- */
.lbody{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--bd);background:var(--p1);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tab span{font-size:18px}
.tab.on{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:transparent;color:#fff}
.panel{background:var(--p1);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.opt label{display:block;font-size:11px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:1 1 auto;min-height:40px;padding:0 10px;border-radius:11px;border:1px solid var(--bd);background:var(--p2);font-weight:700;font-size:13px}
.chip.on{background:#f59e0b;border-color:#f59e0b;color:#1c1100}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--bd);background:#0a1224;text-align:center;font-weight:900;font-size:22px;letter-spacing:4px;padding:0 8px;text-transform:uppercase}
.codebox input:disabled{color:var(--am)}
.row{display:flex;gap:8px}
.row>.btn{flex:1}
.stat{font-size:12px;text-align:center;color:var(--mu);min-height:16px}
.stat.ok{color:var(--gn);font-weight:800}
.stat.err{color:var(--rd);font-weight:800}
.note{font-size:11px;color:var(--mu);line-height:1.4}

/* ---------- màn hình chơi ---------- */
.strip{display:flex;align-items:center;gap:8px;padding:5px 12px;min-height:42px;flex:0 0 auto;background:var(--p1);border-top:1px solid #1b2745;border-bottom:1px solid #1b2745;transition:background .2s}
.strip.turn{background:linear-gradient(90deg,#1e3a5f,#172554);box-shadow:inset 0 -2px 0 var(--ac)}
.sdot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px solid #fff3}
.sdot.sw{background:#f8fafc}.sdot.sb{background:#111827;border-color:#64748b}.sdot.sr{background:#dc2626}.sdot.sx{background:#38bdf8}.sdot.so{background:#fb7185}.sdot.sp1{background:#38bdf8}.sdot.sp2{background:#fb7185}
.sname{font-size:13px;white-space:nowrap}
.sextra{flex:1;min-width:0;font-size:15px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:-1px}
.sclock{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:#0a1224;border-radius:8px;padding:3px 8px;min-width:58px;text-align:center}
.sclock.low{color:var(--rd);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
#g-area{flex:1 1 0;min-height:0;position:relative;overflow:hidden;touch-action:none}
.actions{display:flex;gap:6px;padding:6px 8px 8px;flex:0 0 auto}
.abtn{flex:1;min-height:52px;border-radius:13px;border:1px solid var(--bd);background:var(--p2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:800;padding:0}
.abtn .ai{font-size:18px;line-height:1}
.abtn:active{transform:scale(.96)}

/* ---------- cờ vua ---------- */
.chess{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.cell{position:relative;display:grid;place-items:center;background:#f0d9b5;user-select:none;-webkit-user-select:none}
.cell.d{background:#b58863}
.cell.last{background:#cdd26a}.cell.d.last{background:#aaa23a}
.cell.sel{background:#f6f669!important}
.cell.chk{background:radial-gradient(circle,#ff2a2a 0,#ff2a2a 35%,transparent 75%),#f0d9b5}
.cell.d.chk{background:radial-gradient(circle,#ff2a2a 0,#ff2a2a 35%,transparent 75%),#b58863}
.cell .pc{line-height:1;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","Noto Sans Symbols",sans-serif;pointer-events:none}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}
.pc.b{color:#161616;text-shadow:0 0 1px #fff8}
.cell .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,85,30,.5);pointer-events:none}
.cell .ring{position:absolute;inset:3%;border-radius:50%;border:4px solid rgba(20,85,30,.5);pointer-events:none}
.cell i{position:absolute;font-style:normal;font-size:9px;font-weight:800;opacity:.7;pointer-events:none;color:#7a5a36}
.cell i.f{right:3px;bottom:1px}.cell i.r{left:3px;top:1px}
.promo{position:absolute;inset:0;background:rgba(5,10,25,.8);display:flex;align-items:center;justify-content:center;gap:10px;z-index:5}
.promo button{width:64px;height:64px;border-radius:14px;border:2px solid #f59e0b;background:#fde68a;font-size:44px;line-height:1;padding:0;color:#111;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif}

/* ---------- cờ tướng ---------- */
.xqb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#e3ba7f,#ca9e5a 50%,#b38543);border:3px solid #5a3613;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.xqb canvas,.xqb .layer{position:absolute;left:0;top:0;width:100%;height:100%}
.xqb .layer{pointer-events:none}
.xp{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Ma Shan Zheng","Noto Serif TC","Songti SC","STKaiti",serif;font-weight:900;user-select:none;-webkit-user-select:none;box-shadow:2px 3px 6px rgba(0,0,0,.45),inset -1px -1px 4px rgba(0,0,0,.3),inset 1px 1px 4px rgba(255,255,255,.7);transition:transform .12s}
.xp.r{background:linear-gradient(135deg,#fee2e2,#fffbeb 50%,#fecaca);border:2px solid #b91c1c;color:#b91c1c}
.xp.k{background:linear-gradient(135deg,#e2e8f0,#f5f5f4 50%,#94a3b8);border:2px solid #0f172a;color:#0f172a}
.xp.hid{background:linear-gradient(135deg,#a8895c,#7a5a30);color:transparent;border-color:#3b2a10}
.xp.hid.r{border-color:#b91c1c}.xp.hid.k{border-color:#0f172a}
.xp.hid::after{content:"";position:absolute;width:46%;height:46%;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.xp.hid.r::after{background:rgba(220,38,38,.55)}.xp.hid.k::after{background:rgba(15,23,42,.65)}
.xp.sel{transform:scale(1.12) translateY(-2px);box-shadow:0 0 14px #f59e0b,2px 4px 8px rgba(0,0,0,.5);z-index:5}
.xp.mv.r{background:linear-gradient(135deg,#fcd34d,#fef08a 50%,#fbbf24)}
.xp.mv.k{background:linear-gradient(135deg,#7dd3fc,#e0f2fe 50%,#38bdf8)}
.xp.chk{animation:chk .9s infinite}
@keyframes chk{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.95),0 0 14px rgba(239,68,68,.85)}50%{box-shadow:0 0 0 5px rgba(239,68,68,.3),0 0 5px rgba(239,68,68,.35)}}
.hl{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.hl.t{background:rgba(5,120,70,.85)}
.hl.c{border:4px solid rgba(239,68,68,.95);background:rgba(239,68,68,.2)}
.hl.f{border:2px dashed #047857;background:rgba(16,185,129,.22)}

/* ---------- caro / canvas ---------- */
.cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);touch-action:none}
.fullcv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(3,7,18,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex;animation:fi .18s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mbox{width:100%;max-width:340px;background:linear-gradient(160deg,#16213d,#0e1730);border:1px solid var(--bd);border-radius:22px;padding:20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mbox .micon{font-size:46px;line-height:1}
.mbox h3{margin:8px 0 4px;font-size:21px;font-weight:900}
.mbox p{margin:0 0 12px;color:var(--mu);font-size:14px;line-height:1.4}
.mbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mbtns .btn{flex:1 1 40%}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(8,14,30,.95);border:1px solid #f59e0b88;color:#fde68a;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="hhead"><div class="logo">♟</div><div><h1>Cờ &amp; Game 2 Người</h1><p>Chơi với máy hoặc online qua mật khẩu phòng</p></div><button class="ib sndbtn" style="margin-left:auto">🔊</button></div>
    <div class="hgrid" id="hgrid"></div>
    <div class="hfoot" id="hfoot"></div>
  </section>
  <section id="lobby" class="screen">
    <div class="bar"><button class="ib" id="l-back">‹</button><div class="bt"><div id="l-title"></div><small>Chọn chế độ chơi</small></div><button class="ib sndbtn">🔊</button></div>
    <div class="lbody" id="lbody"></div>
  </section>
  <section id="game" class="screen">
    <div class="bar" style="min-height:46px;padding:4px 10px"><button class="ib" id="g-back" style="width:38px;height:38px">‹</button><div class="bt"><div id="g-title"></div><small id="g-status"></small></div><button class="ib sndbtn" style="width:38px;height:38px">🔊</button></div>
    <div class="strip" id="g-top"></div>
    <div id="g-area"></div>
    <div class="strip" id="g-bot"></div>
    <div class="actions" id="g-actions"></div>
  </section>
</div>
<div class="modal" id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ====================== TIỆN ÍCH ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(9).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const LEVEL_NAMES = ['Kỳ đồng', 'Kỳ nhân', 'Kỳ lão', 'Kỳ vương'];

/* ====================== ÂM THANH ====================== */
const Snd = {
  ctx: null, on: LS.get('mgv2.snd', true),
  tone(f, d = 0.08, type = 'sine', v = 0.12, delay = 0) {
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx; if (c.state === 'suspended') c.resume();
      const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + delay;
      o.type = type; o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + 0.02);
    } catch (e) {}
  },
  move() { this.tone(520, .05, 'triangle', .1); },
  cap() { this.tone(260, .1, 'square', .07); this.tone(180, .08, 'square', .06, .05); },
  ping() { this.tone(880, .12, 'sine', .2); },
  ping2() { this.tone(880, .1, 'sine', .2); this.tone(880, .1, 'sine', .2, .16); },
  win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .16, 'sine', .15, i * .11)); },
  lose() { [330, 262, 196].forEach((f, i) => this.tone(f, .22, 'sawtooth', .08, i * .15)); },
  hit() { this.tone(700, .06, 'square', .08); },
  bad() { this.tone(150, .18, 'sawtooth', .1); },
  tick() { this.tone(660, .06, 'sine', .12); },
  go() { this.tone(988, .25, 'sine', .18); }
};

/* ====================== TOAST & MODAL ====================== */
let toastT = 0;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
function modal(o) {
  const m = $('#modal'); m.innerHTML = '';
  const box = h('div', { class: 'mbox' },
    o.icon ? h('div', { class: 'micon' }, o.icon) : null,
    h('h3', {}, o.title || ''),
    o.text ? h('p', {}, o.text) : null,
    o.body || null,
    h('div', { class: 'mbtns' }, (o.buttons || []).map(b =>
      h('button', { class: 'btn ' + (b.cls || ''), onclick: () => { if (!b.keep) closeModal(); if (b.fn) b.fn(); } }, b.label))));
  m.append(box); m.classList.add('on');
}
function confirmBox(title, text, yes, no, cb) {
  modal({ title, text, buttons: [{ label: no || 'Không', fn: () => cb && cb(false) }, { label: yes || 'Đồng ý', cls: 'pri', fn: () => cb && cb(true) }] });
}

/* ====================== CHIỀU CAO ỨNG DỤNG ====================== */
function isMobileDev() { const sw = (window.screen && screen.width) || 9999; return Math.min(innerWidth, sw) < 640; }
const resizeHooks = [];
function setAppH() {
  let H = innerHeight; const W = Math.min(innerWidth, 560);
  if (isMobileDev() && H < W * 1.6) H = Math.round(W * 2);   // khung nhúng thấp: kéo dài ra
  document.documentElement.style.setProperty('--appH', H + 'px');
}
let rzRaf = 0;
function onResize() {
  setAppH(); cancelAnimationFrame(rzRaf);
  rzRaf = requestAnimationFrame(() => resizeHooks.forEach(f => { try { f(); } catch (e) {} }));
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
setAppH();

/* ====================== MẠNG (PeerJS) ====================== */
const Net = (() => {
  const PFX = 'mgv2-';
  const STUN = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  // TURN: đường chuyển tiếp khi 2 máy không nối thẳng được (cùng Wi-Fi bị cách ly, khác mạng, 4G...)
  const TURN = [
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }
  ];
  const ICE = STUN.concat(TURN);
  const popts = () => Object.assign({ debug: 0, config: { iceServers: ICE, iceCandidatePoolSize: 4 } }, window.PEER_OPTS || {});
  let peer = null, conn = null, hd = null, timer = 0;
  const clean = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const pid = (gid, code) => PFX + gid + '-' + clean(code);
  function close() {
    clearTimeout(timer); const c = conn, p = peer; conn = null; peer = null; hd = null;
    try { c && c.close(); } catch (e) {} try { p && p.destroy(); } catch (e) {}
  }
  // theo dõi trạng thái ICE: nếu 2 máy không thông nhau thì báo lỗi rõ ràng thay vì treo
  function watchIce(c, handlers) {
    let tries = 0;
    const iv = setInterval(() => {

/* ====================== KHUNG CHUNG CHO CỜ THEO LƯỢT ====================== */
class TurnBase {
  constructor(api) { this.api = api; this.timer = null; this.over = true; this.aiId = 0; }
  /* ---- các hàm game ghi đè ---- */
  sideInfo(s) { return { name: s === 1 ? 'Bên 1' : 'Bên 2', cls: '' }; }
  extraOf(s) { return ''; }
  checkText() { return ''; }
  initRules(cfg) {}
  render() {}
  resize() {}
  snap() { return null; }
  restore(s) {}
  enc(m) { return m; }
  dec(m) { return m; }
  isLegal(m) { return true; }
  doMove(m) { return {}; }
  endCheck() { return null; }
  aiMove(cb) { cb(null); }
  aiDrawOK() { return false; }
  onGameNet(m) {}

  /* ---- vòng đời ---- */
  start(cfg) {
    this.destroy();
    this.cfg = cfg; this.mode = cfg.mode;
    this.mySide = cfg.mode === 'local' ? 1 : cfg.mySide;
    this.turn = 1; this.over = false; this.thinking = false;
    this.hist = []; this.moves = []; this.last = null; this.grace = 0; this.warnSec = -1;
    const mins = +cfg.clock || 0; this.useClock = mins > 0; this.clock = { 1: mins * 60000, '-1': mins * 60000 };
    this.lastTick = Date.now();
    this.initRules(cfg);
    this.buildChrome();
    this.render(); this.updateUI();
    this.timer = setInterval(() => this.tick(), 200);
    if (this.mode === 'ai' && this.turn !== this.mySide) this.scheduleAI();
  }
  destroy() {
    clearInterval(this.timer); this.timer = null; this.aiId++; this.over = true; this.thinking = false;
  }
  buildChrome() {
    const a = this.api.el;
    a.title.textContent = this.cfg.title;
    const mk = root => {
      root.innerHTML = '';
      const dot = h('i', { class: 'sdot' }), name = h('b', { class: 'sname' }), extra = h('span', { class: 'sextra' }), clock = h('span', { class: 'sclock' });
      root.append(dot, name, extra, clock); return { root, dot, name, extra, clock };
    };
    this.S = { bot: mk(a.bot), top: mk(a.top) };
    a.actions.innerHTML = '';
    const btn = (ic, lb, fn) => h('button', { class: 'abtn', onclick: fn }, h('span', { class: 'ai' }, ic), h('span', {}, lb));
    a.actions.append(btn('↺', 'Đánh lại', () => this.askUndo()), btn('🤝', 'Hòa', () => this.askDraw()), btn('🏳', 'Đầu hàng', () => this.askResign()), btn('⌂', 'Menu', () => this.api.leave()));
  }
  stripOf(s) { return s === this.mySide ? this.S.bot : this.S.top; }
  nameOf(s) {
    const lab = this.sideInfo(s).name;
    if (this.mode === 'ai') return (s === this.mySide ? 'Bạn' : LEVEL_NAMES[this.cfg.level] + ' (Máy)') + ' · ' + lab;
    if (this.mode === 'local') return 'Người ' + (s === 1 ? 1 : 2) + ' · ' + lab;
    return (s === this.mySide ? 'Bạn' : 'Đối thủ') + ' · ' + lab;
  }
  runs(s) { return this.mode === 'ai' ? s === this.mySide : true; }
  clockText(s) {
    if (this.mode === 'ai' && s !== this.mySide) return '🤖';
    if (!this.useClock) return '∞';
    return fmtClock(this.clock[s]);
  }
  updateUI() {
    [1, -1].forEach(s => {
      const S = this.stripOf(s); if (!S) return;
      S.name.textContent = this.nameOf(s);
      S.dot.className = 'sdot ' + this.sideInfo(s).cls;
      S.extra.textContent = this.extraOf(s);
      S.root.classList.toggle('turn', !this.over && this.turn === s);
      S.clock.textContent = this.clockText(s);
      S.clock.classList.toggle('low', this.useClock && this.runs(s) && this.clock[s] <= 15000 && !this.over);
    });
    let st;
    if (this.over) st = 'Kết thúc';
    else if (this.thinking) st = 'Máy đang nghĩ…';
    else if (this.mode === 'local') st = 'Lượt ' + this.sideInfo(this.turn).name;
    else st = this.turn === this.mySide ? 'Đến lượt bạn' : 'Chờ đối thủ…';
    this.api.el.status.textContent = (this.over ? '' : this.checkText()) + st;
  }
  canAct() { return !this.over && !this.thinking && !this.busy && (this.mode === 'local' || this.turn === this.mySide); }

  /* ---- đồng hồ ---- */
  tick() {
    if (this.over) return;
    const now = Date.now(), dt = now - this.lastTick; this.lastTick = now;
    if (this.useClock && this.runs(this.turn)) {
      this.clock[this.turn] -= dt;
      const mine = this.mode === 'local' || this.turn === this.mySide;
      if (this.clock[this.turn] <= 0) {
        this.clock[this.turn] = 0;
        if (mine) {
          if (this.mode === 'online') this.api.send({ t: 'timeout' });
          this.finish({ winner: -this.turn, reason: 'Hết giờ' });
        } else if (!this.grace) this.grace = now + 3000;
        else if (now > this.grace) this.finish({ winner: this.mySide, reason: 'Đối thủ hết giờ' });
      } else if (mine && this.mode !== 'local' && this.clock[this.turn] <= 15000) {
        const sec = Math.ceil(this.clock[this.turn] / 1000);
        if (sec !== this.warnSec) { this.warnSec = sec; Snd.ping2(); }
      }
    }
    [1, -1].forEach(s => { const S = this.stripOf(s); if (S) { S.clock.textContent = this.clockText(s); S.clock.classList.toggle('low', this.useClock && this.runs(s) && this.clock[s] <= 15000); } });
  }

  /* ---- đi một nước ---- */
  commit(mv, src) {
    if (this.over) return;
    this.hist.push({ s: this.snap(), last: this.last });
    const mover = this.turn;
    const info = this.doMove(mv) || {};

    this.last = info.last || null; this.lastInfo = info;
    this.lastTick = Date.now(); this.grace = 0; this.warnSec = -1;
    if (this.mode === 'online' && src === 'me') this.api.send({ t: 'mv', m: this.enc(mv), n: this.moves.length });

    if (src !== 'me' && this.mode !== 'local') { Snd.ping(); try { navigator.vibrate && navigator.vibrate(35); } catch (e) {} }

  scheduleAI() {
    this.thinking = true; const id = ++this.aiId; this.updateUI();

    }, 380);
  }
  finish(res) {
    if (this.over) return;
    this.over = true; this.thinking = false; this.aiId++;

    this.render(); this.updateUI();
    let kind, title;
    if (res.draw) { kind = 'draw'; title = 'Hòa 🤝'; }
    else if (this.mode === 'local') { kind = 'win'; title = this.sideInfo(res.winner).name + ' thắng! 🎉'; }
    else if (res.winner === this.mySide) { kind = 'win'; title = 'Bạn thắng! 🎉'; }
    else { kind = 'lose'; title = 'Bạn thua 😢'; }
    if (kind === 'win') Snd.win(); else if (kind === 'lose') Snd.lose(); else Snd.move();
    setTimeout(() => this.api.result({ kind, title, text: res.reason || '' }), res.fast ? 0 : 650);
  }

  /* ---- nút chức năng ---- */
  askResign() {
    if (this.over) return;
    confirmBox('Đầu hàng?', 'Bạn sẽ thua ván này.', 'Đầu hàng', 'Tiếp tục', ok => {
      if (!ok || this.over) return;
      if (this.mode === 'online') this.api.send({ t: 'resign' });
      this.finish({ winner: this.mode === 'local' ? -this.turn : -this.mySide, reason: 'Đã đầu hàng', fast: true });
    });
  }
  askDraw() {
    if (this.over) return;
    if (this.mode === 'ai') {
      if (this.moves.length >= 20 && this.aiDrawOK()) this.finish({ draw: true, reason: 'Máy đồng ý hòa', fast: true });
      else toast('Máy từ chối hòa');
    } else if (this.mode === 'local') {
      confirmBox('Xin hòa', 'Hai bên đồng ý hòa?', 'Đồng ý hòa', 'Không', ok => { if (ok) this.finish({ draw: true, reason: 'Hai bên đồng ý hòa', fast: true }); });
    } else { this.api.send({ t: 'drawReq' }); toast('Đã gửi lời xin hòa'); }
  }
  askUndo() {
    if (this.over) return;
    if (this.mode === 'online') {
      if (!this.moves.some(m => m.side === this.mySide)) return toast('Bạn chưa đi nước nào');
      this.api.send({ t: 'undoReq', side: this.mySide }); toast('Đã xin đánh lại');
    } else if (this.mode === 'ai') {
      if (!this.moves.some(m => m.side === this.mySide)) return toast('Bạn chưa đi nước nào');
      this.undoOf(this.mySide);
    } else {
      if (!this.moves.length) return toast('Chưa có nước nào');
      this.undoOf(-this.turn);
    }
  }
  undoOf(side) {
    let idx = -1;
    for (let i = this.moves.length - 1; i >= 0; i--) if (this.moves[i].side === side) { idx = i; break; }
    if (idx < 0) return;
    this.aiId++; this.thinking = false;
    const hh = this.hist[idx];
    this.restore(hh.s); this.last = hh.last;
    this.hist.length = idx; this.moves.length = idx;
    this.over = false; this.lastTick = Date.now();
    if (!this.timer) this.timer = setInterval(() => this.tick(), 200);
    this.render(); this.updateUI();
    if (this.mode === 'ai' && this.turn !== this.mySide) this.scheduleAI();
  }

  /* ---- tin nhắn từ đối thủ ---- */
  onNet(m) {
    if (!m) return;
    if (this.over && m.t === 'mv') return;
    switch (m.t) {
      case 'mv': {
        if (this.mode !== 'online' || this.turn === this.mySide) return;
        const mv = this.dec(m.m);
        if (!this.isLegal(mv)) { toast('Nước đi không hợp lệ (lệch ván)'); return; }
        this.commit(mv, 'remote'); break;

      case 'resign': this.finish({ winner: this.mySide, reason: 'Đối thủ đầu hàng', fast: true }); break;
      case 'timeout': this.finish({ winner: this.mySide, reason: 'Đối thủ hết giờ', fast: true }); break;
      case 'leave': this.finish({ winner: this.mySide, reason: 'Đối thủ đã thoát', fast: true }); break;
      case 'drawReq':
        Snd.ping();
        confirmBox('Đối thủ xin hòa', 'Bạn có đồng ý không?', 'Đồng ý', 'Từ chối', ok => {
          if (ok) { this.api.send({ t: 'drawYes' }); this.finish({ draw: true, reason: 'Hai bên đồng ý hòa', fast: true }); } else this.api.send({ t: 'drawNo' });
        }); break;
      case 'drawYes': this.finish({ draw: true, reason: 'Đối thủ đồng ý hòa', fast: true }); break;
      case 'drawNo': toast('Đối thủ từ chối hòa'); break;
      case 'undoReq':
        Snd.ping();
        confirmBox('Đối thủ xin đánh lại', 'Cho đối thủ đi lại nước vừa rồi?', 'Đồng ý', 'Từ chối', ok => {
          if (ok) { this.api.send({ t: 'undoYes', side: m.side }); this.undoOf(m.side); } else this.api.send({ t: 'undoNo' });
        }); break;

      case 'undoNo': toast('Đối thủ không cho đánh lại'); break;

    }
  }
}

      for (let k = 0; k < this.items.length; k++) {
        if (L.st[k]) continue; const it = this.items[k]; if (it.t > this.T) break;
        const y = this.y(it); ctx.fillText(it.type === 0 ? '🏀' : it.type === 1 ? '⭐' : '💣', x0 + it.x * lw, y * H * .93);
      }
      ctx.font = (lw * .3) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      const by = H * .965; ctx.fillText('🧺', x0 + L.bx * lw, by);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = 'bold ' + Math.max(12, lw * .08) + 'px sans-serif'; ctx.fillText(i === 0 ? 'BẠN' : 'ĐỐI THỦ', x0 + lw / 2, 14);
    }
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(lw - 1, 0, 2, H);
    ctx.font = 'bold ' + Math.max(16, lw * .13) + 'px sans-serif';
    for (const e of this.fx) { const k = e.t / .7; ctx.globalAlpha = 1 - k; ctx.fillStyle = e.pts > 0 ? '#fde68a' : '#fca5a5'; ctx.fillText((e.pts > 0 ? '+' : '') + e.pts, e.lane * lw + e.x * lw, e.y * H * .93 - k * H * .08); ctx.globalAlpha = 1; }
    if (this.phase === 0) {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + (W * .45) + 'px sans-serif'; ctx.fillText(this.cd > 3 ? '' : String(Math.max(1, Math.ceil(this.cd - .4))), W / 2, H / 2);
      ctx.font = 'bold ' + (W * .06) + 'px sans-serif'; ctx.fillText('Kéo ngón tay trái/phải để đỡ bóng', W / 2, H * .3);
    }
  }
}

/* ====================== ĐIỀU KHIỂN CHUNG ====================== */
const CREDITS = '';
const GAMES = [
  { id: 'chess', name: 'Cờ vua', ic: '♞', desc: 'Nhập thành, bắt tốt qua đường, phong cấp', c: ['#64748b', '#1e293b'], turn: true, clock: [0, 3, 5, 10], make: a => new ChessGame(a) },
  { id: 'xq', name: 'Cờ tướng', ic: '帥', icT: true, desc: 'Cờ tướng truyền thống', c: ['#b45309', '#7c2d12'], turn: true, clock: [0, 3, 5, 10], sides: ['Đỏ (đi trước)', 'Đen', 'Ngẫu nhiên'], make: a => new XiangqiGame(a, false) },
  { id: 'jq', name: 'Cờ úp', ic: '暗', icT: true, desc: 'Quân úp, lật khi đi lần đầu', c: ['#7c3aed', '#4c1d95'], turn: true, clock: [0, 3, 5, 10], sides: ['Đỏ (đi trước)', 'Đen', 'Ngẫu nhiên'], make: a => new XiangqiGame(a, true) },
  { id: 'caro', name: 'Cờ caro', ic: '✕○', desc: '5 quân liên tiếp trên bàn 15×15', c: ['#0891b2', '#164e63'], turn: true, clock: [0, 3, 5], sides: ['X (đi trước)', 'O', 'Ngẫu nhiên'], caro: true, make: a => new CaroGame(a) },
  { id: 'fly', name: 'Bắn ruồi', ic: '🪰', desc: 'Chạm ruồi nhanh hơn đối thủ, tránh ong!', c: ['#16a34a', '#14532d'], rt: true, make: a => new FlyGame(a) },
  { id: 'ball', name: 'Đỡ bóng', ic: '🧺', desc: 'Kéo rổ đỡ bóng, ⭐ +3, 💣 −3', c: ['#f97316', '#9a3412'], rt: true, make: a => new BallGame(a) }
];
const gameById = id => GAMES.find(g => g.id === id);

const M = { gm: null, game: null, cfg: null, role: null, tab: 'ai', opt: null, myReq: false, oppReq: false, code: '', netState: '', wake: null };
const api = {
  el: {},
  send: m => Net.send(m),
  leave: () => leaveGame(true),
  result: r => showResult(r)
};
function showScreen(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); resizeHooks.forEach(f => { try { f(); } catch (e) {} }); }
function optKey(g) { return 'mgv2.opt.' + g.id; }
function loadOpt(g) { return Object.assign({ level: 1, side: 0, clock: 0, blocked: false }, LS.get(optKey(g), {})); }
function saveOpt() { LS.set(optKey(M.gm), M.opt); }
function genCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[(Math.random() * a.length) | 0]; return s; }
function cleanCode(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
async function keepAwake(on) {
  try { if (on && navigator.wakeLock) M.wake = await navigator.wakeLock.request('screen'); else if (M.wake) { M.wake.release(); M.wake = null; } } catch (e) {}
}

/* ---------- trang chủ ---------- */
function buildHome() {
  const grid = $('#hgrid'); grid.innerHTML = '';
  GAMES.forEach(g => {
    grid.append(h('button', { class: 'card', style: `background:linear-gradient(150deg,${g.c[0]},${g.c[1]})`, onclick: () => openLobby(g.id) },
      h('div', { class: 'ic' + (g.icT ? ' t' : '') }, g.ic), h('b', {}, g.name), h('small', {}, g.desc), h('div', { class: 'tags' }, '🤖 Đấu máy · 🌐 2 điện thoại')));
  });
  $('#hfoot').textContent = (CREDITS ? CREDITS + ' · ' : '') + 'Chơi online: mỗi người một điện thoại · cần Internet · v2.1';
}

/* ---------- phòng chờ ---------- */
function openLobby(id, tab, code) {
  Net.close(); M.gm = gameById(id); M.opt = loadOpt(M.gm); M.tab = tab || LS.get('mgv2.tab', 'ai'); M.role = null; M.netState = '';
  M.code = cleanCode(code) || LS.get('mgv2.code', '') || genCode();
  $('#l-title').textContent = M.gm.name; showScreen('lobby'); renderLobby();
}
function chips(label, items, cur, onPick) {
  return h('div', { class: 'opt' }, h('label', {}, label), h('div', { class: 'chips' }, items.map(([v, t]) => h('button', { class: 'chip' + (cur === v ? ' on' : ''), onclick: () => { onPick(v); renderLobby(); } }, t))));
}
function renderLobby() {
  const g = M.gm, o = M.opt, body = $('#lbody'); body.innerHTML = '';
  body.append(h('div', { class: 'tabs' },
    h('button', { class: 'tab' + (M.tab === 'ai' ? ' on' : ''), onclick: () => { Net.close(); M.role = null; M.netState = ''; M.tab = 'ai'; LS.set('mgv2.tab', 'ai'); renderLobby(); } }, h('span', {}, '🤖'), 'Đấu với máy'),
    h('button', { class: 'tab' + (M.tab === 'online' ? ' on' : ''), onclick: () => { M.tab = 'online'; LS.set('mgv2.tab', 'online'); renderLobby(); } }, h('span', {}, '🌐'), 'Online 2 điện thoại')));
  const opts = h('div', { class: 'panel' });
  if (M.tab === 'ai') opts.append(chips('Trình độ máy', LEVEL_NAMES.map((n, i) => [i, n]), o.level, v => { o.level = v; saveOpt(); }));
  if (g.sides && (M.tab === 'ai' || M.role !== 'guest')) opts.append(chips(M.tab === 'ai' ? 'Bạn cầm quân' : 'Bạn (chủ phòng) cầm quân', g.sides.map((n, i) => [[1, -1, 0][i], n]), o.side, v => { o.side = v; saveOpt(); }));
  if (g.turn && (M.tab === 'ai' || M.role !== 'guest')) opts.append(chips('Đồng hồ mỗi bên', g.clock.map(m => [m, m ? m + ' phút' : 'Không']), o.clock, v => { o.clock = v; saveOpt(); }));
  if (g.caro && (M.tab === 'ai' || M.role !== 'guest')) opts.append(chips('Luật', [[false, '5 quân thắng'], [true, 'Chặn 2 đầu không tính']], o.blocked, v => { o.blocked = v; saveOpt(); }));
  if (g.rt && M.tab === 'online') opts.append(h('div', { class: 'note' }, g.id === 'fly' ? '30 giây · chủ phòng chạy trò chơi, khách chạm gửi qua mạng. Ruồi +1, ong −2.' : '45 giây · mỗi người một làn, bóng rơi giống hệt nhau. Bóng +1, sao +3, bom −3.'));
  if (g.rt && M.tab === 'ai') opts.append(h('div', { class: 'note' }, g.id === 'fly' ? '30 giây · chạm ruồi nhanh hơn máy, tránh ong.' : '45 giây · kéo ngón tay để di chuyển rổ.'));
  if (opts.children.length) body.append(opts);
  if (M.tab === 'ai') {
    body.append(h('button', { class: 'btn pri', style: 'min-height:54px;font-size:16px', onclick: () => startAI() }, '▶ Bắt đầu'));
  } else body.append(onlinePanel());
}
function onlinePanel() {
  const g = M.gm, p = h('div', { class: 'panel' });
  const busy = !!M.role;
  const inp = h('input', { type: 'text', maxlength: 12, value: M.code, autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', placeholder: 'mật khẩu phòng' });
  if (busy) inp.disabled = true;
  inp.addEventListener('input', () => { M.code = cleanCode(inp.value); inp.value = M.code; LS.set('mgv2.code', M.code); });
  p.append(h('div', { class: 'opt' }, h('label', {}, 'Mật khẩu phòng (hai bên nhập giống nhau)'), h('div', { class: 'codebox' }, inp,
    busy ? null : h('button', { class: 'ib', style: 'height:48px;width:48px', title: 'Mã ngẫu nhiên', onclick: () => { M.code = genCode(); LS.set('mgv2.code', M.code); renderLobby(); } }, '🎲'))));
  const st = h('div', { class: 'stat ' + (M.netState.startsWith('!') ? 'err' : M.netState.startsWith('+') ? 'ok' : '') }, M.netState.replace(/^[!+]/, '') || (busy ? '' : 'Một người bấm "Tạo phòng", người kia bấm "Vào phòng"'));
  if (!busy) {
    p.append(h('div', { class: 'row' },
      h('button', { class: 'btn pri', onclick: () => doHost() }, '🏠 Tạo phòng'),
      h('button', { class: 'btn gold', onclick: () => doJoin() }, '🚪 Vào phòng')));
  } else {
    p.append(h('div', { class: 'row' },
      M.role === 'host' ? h('button', { class: 'btn', onclick: () => shareLink() }, '🔗 Gửi link mời') : null,
      h('button', { class: 'btn red', onclick: () => { Net.close(); M.role = null; M.netState = ''; renderLobby(); } }, '✕ Hủy')));
  }
  p.append(st);
  p.append(h('button', { class: 'btn', style: 'min-height:40px;font-size:13px', onclick: () => runDiag() }, '🔧 Kiểm tra kết nối'));
  p.append(h('div', { class: 'note' }, 'Hai điện thoại cần có Internet (4G/Wi-Fi). Gửi mật khẩu phòng hoặc link mời cho đối thủ. Chủ phòng chọn luật chơi.'));
  return p;
}
function setNet(msg) { M.netState = msg; if ($('#lobby').classList.contains('on')) renderLobby(); }
function netErr(code, err) {
  const t = {
    nopeer: 'Không tải được thư viện mạng PeerJS. Hãy kiểm tra Internet, mở bằng Safari/Chrome (không mở trong Zalo/Facebook), rồi bấm "Kiểm tra kết nối".',
    taken: 'Mật khẩu này đang có người dùng — hãy đổi mật khẩu khác (hoặc chờ 1 phút nếu bạn vừa tạo phòng này).',
    notfound: 'Không tìm thấy phòng. Chủ phòng phải bấm "Tạo phòng" trước và giữ nguyên màn hình; hai bên nhập ĐÚNG mật khẩu và vào đúng game.',
    timeout: 'Hai máy bắt tay quá lâu. Thử lại; nếu vẫn lỗi hãy bấm "Kiểm tra kết nối".',
    server: 'Không nối được máy chủ trung gian PeerJS. Kiểm tra Internet, tắt VPN / chặn quảng cáo rồi thử lại.',
    ice: 'Hai máy không thông nhau được (mạng chặn hoặc Wi-Fi cách ly thiết bị). Thử đổi một máy sang 4G, hoặc bấm "Kiểm tra kết nối".',
    browser: 'Trình duyệt này không hỗ trợ WebRTC. Hãy dùng Safari hoặc Chrome bản mới.',
    fail: 'Lỗi kết nối mạng — thử lại.'
  }[code] || 'Lỗi mạng';
  const det = err && err.type ? ' (mã: ' + err.type + ')' : '';
  M.role = null; Net.close(); setNet('!' + t + det);
}
function runDiag() {
  const list = h('div', { style: 'text-align:left;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.35;max-height:52vh;overflow:auto' });
  const add = r => list.append(h('div', { style: 'display:flex;gap:8px' }, h('b', { style: 'flex:0 0 auto;color:' + (r.ok === true ? 'var(--gn)' : r.ok === false ? 'var(--rd)' : 'var(--mu)') }, r.ok === true ? '✔' : r.ok === false ? '✘' : '•'), h('span', {}, r.text)));
  list.append(h('div', { class: 'note', id: 'dg-run' }, 'Đang kiểm tra (khoảng 10–20 giây)…'));
  modal({ icon: '🔧', title: 'Kiểm tra kết nối', body: list, buttons: [{ label: 'Đóng' }] });
  Net.diag(add).then(() => { const x = $('#dg-run'); if (x) x.textContent = 'Xong. Chụp màn hình này gửi mình nếu vẫn không nối được.'; });
}
function handlers() {
  return {
    onReady: () => setNet('+Phòng đã sẵn sàng — chờ đối thủ nhập mật khẩu "' + M.code + '"…'),
    onConnected: () => { if (M.role === 'host') { setNet('+Đối thủ đã vào!'); hostStart(true); } else setNet('+Đã vào phòng — chờ chủ phòng bắt đầu…'); },
    onData: onNetData, onClose: onNetClose, onError: netErr, onProgress: m => { if (M.role) setNet(m); }
  };
}
function doHost() {
  if (M.code.length < 3) { setNet('!Mật khẩu tối thiểu 3 ký tự'); return; }
  LS.set('mgv2.code', M.code); M.role = 'host'; M.myReq = M.oppReq = false; setNet('Đang tạo phòng…'); Net.host(M.gm.id, M.code, handlers());
}
function doJoin() {
  if (M.code.length < 3) { setNet('!Nhập mật khẩu phòng'); return; }
  LS.set('mgv2.code', M.code); M.role = 'guest'; M.myReq = M.oppReq = false; setNet('Đang vào phòng…'); Net.join(M.gm.id, M.code, handlers());
}
function shareLink() {
  const url = location.href.split('?')[0].split('#')[0] + '?g=' + M.gm.id + '&r=' + M.code;
  const txt = 'Chơi ' + M.gm.name + ' với mình! Mật khẩu phòng: ' + M.code;
  if (navigator.share) navigator.share({ title: M.gm.name, text: txt, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(txt + '\n' + url).then(() => toast('Đã chép link mời'), () => toast(url));
  else toast(url);
}

/* ---------- bắt đầu ván ---------- */
function resolveSide(s) { return s === 0 ? (Math.random() < .5 ? 1 : -1) : s; }
function baseCfg(mode) {
  const g = M.gm, o = M.opt;
  const cfg = { mode, gid: g.id, title: g.name, level: o.level, clock: g.turn ? o.clock : 0, blocked: !!o.blocked, mySide: 1, seed: (Math.random() * 1e9) | 0 };
  if (g.id === 'jq') { Engine.setJieqi(true); cfg.setup = Array.from(Engine.jieqiSetup()); }
  return cfg;
}
function startAI() { const cfg = baseCfg('ai'); cfg.mySide = g_rt(M.gm) ? 1 : resolveSide(M.opt.side); beginGame(cfg); }
function g_rt(g) { return !!g.rt; }
function hostStart(first) {
  const cfg = baseCfg('online'); let hs;
  if (g_rt(M.gm)) hs = 1;
  else if (first || M.hostSide == null) hs = resolveSide(M.opt.side); else hs = -M.hostSide;   // đổi bên khi chơi lại
  M.hostSide = hs; cfg.mySide = hs;
  const gc = Object.assign({}, cfg, { mySide: -hs });
  Net.send({ t: 'start', cfg: gc }); beginGame(cfg);
}
function beginGame(cfg) {
  closeModal(); if (M.game) { try { M.game.destroy(); } catch (e) {} }
  M.cfg = cfg; M.gm = gameById(cfg.gid); M.myReq = M.oppReq = false;
  api.el = { title: $('#g-title'), status: $('#g-status'), top: $('#g-top'), bot: $('#g-bot'), actions: $('#g-actions'), area: $('#g-area') };
  $('#g-area').innerHTML = ''; showScreen('game'); keepAwake(true);
  M.game = M.gm.make(api);
  requestAnimationFrame(() => { M.game.start(cfg); });
}
function showResult(r) {
  const online = M.cfg && M.cfg.mode === 'online';
  const icon = r.kind === 'win' ? '🏆' : r.kind === 'lose' ? '😢' : '🤝';
  const btns = [{ label: '⌂ Menu', fn: () => leaveGame(false) }, { label: '↻ Chơi lại', cls: 'pri', fn: () => rematch() }];
  modal({ icon, title: r.title, text: r.text, buttons: btns });
}
function rematch() {
  const c = M.cfg; if (!c) return;
  if (c.mode === 'ai') { const n = Object.assign({}, c, { seed: (Math.random() * 1e9) | 0 }); if (!g_rt(M.gm)) n.mySide = -c.mySide; if (c.gid === 'jq') { Engine.setJieqi(true); n.setup = Array.from(Engine.jieqiSetup()); } beginGame(n); return; }
  if (!Net.open) { toast('Đối thủ đã thoát'); leaveGame(false); return; }
  M.myReq = true; Net.send({ t: 'rematchReq' }); toast('Đã gửi lời mời chơi lại…'); tryRematch();
}
function tryRematch() { if (M.myReq && M.oppReq && M.role === 'host') hostStart(false); }
function leaveGame(ask) {
  const doIt = () => {
    if (M.cfg && M.cfg.mode === 'online' && Net.open) Net.send({ t: 'leave' });
    if (M.game) { try { M.game.destroy(); } catch (e) {} } M.game = null; M.cfg = null; keepAwake(false);
    Net.close(); M.role = null; M.netState = ''; closeModal(); showScreen('home');
  };
  if (!ask || !M.game || M.game.over) { doIt(); return; }
  confirmBox('Thoát ván?', M.cfg.mode === 'online' ? 'Bạn sẽ bị xử thua.' : 'Ván đang chơi sẽ mất.', 'Thoát', 'Ở lại', ok => { if (ok) doIt(); });
}
function onNetData(m) {
  if (!m || !m.t) return;
  if (m.t === 'start' && M.role === 'guest') { beginGame(m.cfg); return; }
  if (m.t === 'rematchReq') {
    M.oppReq = true;
    if (M.myReq) tryRematch();
    else if (M.game && M.game.over) { Snd.ping(); confirmBox('Đối thủ muốn chơi lại', 'Bạn có đồng ý không?', 'Chơi lại', 'Thôi', ok => { if (ok) { M.myReq = true; Net.send({ t: 'rematchReq' }); tryRematch(); } else leaveGame(false); }); }
    return;
  }
  if (m.t === 'busy') { netErr('fail'); setNet('!Phòng đã có đủ người'); return; }
  if (M.game && M.cfg && M.cfg.mode === 'online') M.game.onNet(m);
}
function onNetClose() {
  if (M.game && M.cfg && M.cfg.mode === 'online') {
    if (!M.game.over) M.game.onNet({ t: 'leave' }); else toast('Đối thủ đã rời phòng');
  } else if (M.role) { setNet('!Mất kết nối'); M.role = null; renderLobby(); }
}

/* ---------- khởi động ---------- */
function init() {
  buildHome();
  const bindSnd = () => $$('.sndbtn').forEach(b => b.textContent = Snd.on ? '🔊' : '🔇');
  $$('.sndbtn').forEach(b => b.addEventListener('click', () => { Snd.on = !Snd.on; LS.set('mgv2.snd', Snd.on); bindSnd(); if (Snd.on) Snd.move(); }));
  bindSnd();
  $('#l-back').onclick = () => { Net.close(); M.role = null; showScreen('home'); };
  $('#g-back').onclick = () => leaveGame(true);
  resizeHooks.push(() => { if (M.game && $('#game').classList.contains('on') && M.game.resize) M.game.resize(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && M.game && !M.game.over) keepAwake(true); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouch = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });
  const q = new URLSearchParams(location.search), gid = q.get('g'), r = q.get('r');
  if (gid && gameById(gid)) { openLobby(gid, 'online', r || ''); if (r) setTimeout(() => doJoin(), 400); }
  else showScreen('home');
  onResize();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
